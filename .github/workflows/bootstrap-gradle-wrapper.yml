name: Bootstrap Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-wrapper:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Provision Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Generate official wrapper files
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for path in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [[ -e "$path" ]]; then
              echo "Refusing to overwrite existing wrapper file: $path"
              exit 1
            fi
          done
          gradle --version
          gradle :wrapper --gradle-version 8.9 --distribution-type bin
          test -x gradlew
          test -f gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          grep -F 'gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Validate official wrapper JAR checksum
        uses: gradle/actions/wrapper-validation@v4

      - name: Commit wrapper files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          git diff --cached --check
          git commit -m "build(android): add verified Gradle 8.9 wrapper"
          git push origin HEAD:main
