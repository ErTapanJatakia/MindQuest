name: MindQuest Tablet Screenshot Gallery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-gallery:
    name: Generate tablet and Russian interface screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Generate screenshot gallery
        run: node scripts/tablet-screenshot-gallery.mjs

      - name: Upload screenshot gallery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mindquest-tablet-screenshots
          path: artifacts/tablet-gallery/
          if-no-files-found: error
          retention-days: 14
