name: MindQuest Tablet Screenshot Gallery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-gallery:
    name: Generate tablet and Russian interface screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Generate screenshot gallery
        run: node scripts/tablet-screenshot-gallery.mjs

      - name: Upload screenshot gallery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mindquest-tablet-screenshots
          path: artifacts/tablet-gallery/
          if-no-files-found: error
          retention-days: 14
