name: MindQuest Web Validation

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/ci.yml"
      - "docs/QUESTION-LOCALIZATION-REGIONS-BATCH-*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindquest-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: Content, static checks and browser runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit offline runtime security boundaries
        run: npm run audit:security

      - name: Validate enabled question bank
        run: npm run validate:content

      - name: Audit five-region expansion readiness
        run: npm run audit:expansion

      - name: Validate Spanish localization batch
        run: npm run validate:spanish

      - name: Validate staged Spain and Peru content
        run: npm run validate:staged

      - name: Audit claim-level editorial evidence registers
        run: npm run audit:editorial

      - name: Run JavaScript syntax checks
        run: |
          node --check app/src/data/questions.js
          node --check app/src/data/spanish-question-translations.js
          node --check app/src/data/spanish-question-translations-batch-12.js
          node --check app/src/data/spanish-question-translations-batch-13.js
          node --check app/src/data/spanish-question-translations-batch-14.js
          node --check app/src/data/staged-region-questions-batch-01.js
          node --check app/src/app.js
          node --check app/src/ui-polish.js
          node --check app/src/experience.js
          node --check scripts/audit-runtime-security.mjs
          node --check scripts/audit-editorial-evidence.mjs
          node --check scripts/responsive-viewport-smoke.mjs
          node --check scripts/validate-question-bank.mjs
          node --check scripts/audit-question-bank-expansion.mjs
          node --check scripts/validate-spanish-localization.mjs
          node --check scripts/validate-staged-regions.mjs
          node --check scripts/browser-smoke.mjs

      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run browser and gameplay smoke tests
        run: npm run test:browser

      - name: Run responsive viewport regression matrix
        run: npm run test:responsive
