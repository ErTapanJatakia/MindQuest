name: MindQuest Validation

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "android/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindquest-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: Content, static checks and browser runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate question bank
        run: npm run validate:content

      - name: Run JavaScript syntax checks
        run: |
          node --check app/src/data/questions.js
          node --check app/src/app.js
          node --check app/src/ui-polish.js
          node --check scripts/validate-question-bank.mjs
          node --check scripts/browser-smoke.mjs

      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and gameplay smoke tests
        run: npm run test:browser

  android-build:
    name: Android debug APK build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mindquest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
