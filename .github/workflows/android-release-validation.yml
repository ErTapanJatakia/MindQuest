name: MindQuest Android Release Validation

on:
  workflow_dispatch:
    inputs:
      feature_scope_complete:
        description: "Confirm all agreed MindQuest features are implemented and reviewed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-release-validation:
    if: inputs.feature_scope_complete == true
    name: Final Android build and package validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Inspect APK identity, permissions and bundled offline assets
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" > "$RUNNER_TEMP/mindquest-apk-badging.txt"
          grep -Eq "^package: name='com\.mindquest\.app' versionCode='1' versionName='0\.1\.0'" "$RUNNER_TEMP/mindquest-apk-badging.txt"
          grep -Fxq "sdkVersion:'23'" "$RUNNER_TEMP/mindquest-apk-badging.txt"
          grep -Fxq "targetSdkVersion:'35'" "$RUNNER_TEMP/mindquest-apk-badging.txt"

          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/mindquest-apk-permissions.txt"
          if grep -Eq 'uses-permission|android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' "$RUNNER_TEMP/mindquest-apk-permissions.txt"; then
            echo "Unexpected Android permission found in the offline-first package:"
            cat "$RUNNER_TEMP/mindquest-apk-permissions.txt"
            exit 1
          fi

          unzip -Z1 "$APK" > "$RUNNER_TEMP/mindquest-apk-files.txt"
          for asset in assets/index.html assets/styles.css assets/src/app.js assets/src/data/questions.js; do
            if ! grep -Fxq "$asset" "$RUNNER_TEMP/mindquest-apk-files.txt"; then
              echo "Required bundled offline asset missing: $asset"
              exit 1
            fi
          done

          {
            echo "validation_scope=debug-package-inspection-only"
            echo "package_id=com.mindquest.app"
            echo "version_code=1"
            echo "version_name=0.1.0"
            echo "min_sdk=23"
            echo "target_sdk=35"
            echo "manifest_permissions=none"
            echo "required_offline_assets=present"
            printf "apk_sha256="
            sha256sum "$APK" | cut -d ' ' -f 1
            echo
            echo "[aapt package metadata]"
            cat "$RUNNER_TEMP/mindquest-apk-badging.txt"
            echo
            echo "[aapt permission report]"
            cat "$RUNNER_TEMP/mindquest-apk-permissions.txt"
          } > android-validation-evidence.txt

      - name: Upload debug APK and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: mindquest-gate2-debug-validation
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-validation-evidence.txt
          if-no-files-found: error
          retention-days: 14

  guard:
    if: inputs.feature_scope_complete != true
    runs-on: ubuntu-24.04
    steps:
      - name: Stop before Android build
        run: |
          echo "Android build intentionally skipped."
          echo "Complete and review the full feature scope before dispatching this workflow with feature_scope_complete=true."
