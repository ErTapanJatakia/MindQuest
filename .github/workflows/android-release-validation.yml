name: MindQuest Android Release Validation

on:
  workflow_dispatch:
    inputs:
      feature_scope_complete:
        description: "Confirm all agreed MindQuest features are implemented and reviewed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-release-validation:
    if: inputs.feature_scope_complete == true
    name: Final Android build and package validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mindquest-final-validation-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  guard:
    if: inputs.feature_scope_complete != true
    runs-on: ubuntu-24.04
    steps:
      - name: Stop before Android build
        run: |
          echo "Android build intentionally skipped."
          echo "Complete and review the full feature scope before dispatching this workflow with feature_scope_complete=true."
